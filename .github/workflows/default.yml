---
name: Default

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g prettier@3

      - run: sudo apt-get update
      - run: sudo apt-get install -y just shfmt shellcheck

      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise use -g "aqua:rhysd/actionlint@1"

      - run: just check
        env:
          JUST_UNSTABLE: "true" # needed for --fmt
